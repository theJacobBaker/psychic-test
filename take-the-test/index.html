<!DOCTYPE html>

<html lang="en-US">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/><style>:root{--bg:#f0f4f8;--bg-soft:#e4ecf4;--bg-card:#f8fafc;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#6b6b6b;--ink-4:#9aa3af;--line:#d6dfe8;--line-2:#bcc9d8;--accent:#4a6fa5;--accent-deep:#1a2842;--green:#4a7a52;--serif:"Fraunces",Georgia,serif;--sans:"Inter",-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
img{max-width:100%}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.container{max-width:960px;margin:0 auto;padding:0 24px}
.header{padding:22px 0;border-bottom:1px solid var(--line);background:rgba(240,244,248,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.header-inner{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{display:flex;gap:10px;align-items:center;font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 180deg,#1a2842,#4a6fa5,#b8c8e0,#1a2842);position:relative;flex:0 0 auto}
.logo-mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.logo-mark::before{content:"";position:absolute;top:3px;left:50%;width:2px;height:20px;background:var(--ink);transform:translateX(-50%);border-radius:2px}
.header-nav{display:flex;gap:24px;align-items:center;font-size:14px;color:var(--ink-2)}
.header-nav a:hover{color:var(--ink)}
.header-nav .btn{height:40px;padding:0 18px;font-size:13px}
.header-meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
@media(max-width:760px){.header-nav a:not(.btn){display:none}}

.progress-wrap{padding:16px 0;border-bottom:1px solid var(--line)}
.progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 28px;font-size:15px;font-weight:600;border-radius:999px;transition:all .15s}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(26,40,66,.35)}
.btn-secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-secondary:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.btn-ghost{color:var(--ink-3);padding:0 16px;height:44px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:6px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:999px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

.intro{padding:70px 0 84px;text-align:center}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1.03;letter-spacing:-.025em;margin:20px 0 20px}
h1 em{font-style:italic;font-weight:300;color:var(--accent-deep)}
.lede{font-size:18px;color:var(--ink-2);max-width:600px;margin:0 auto 36px}
.intro-meta{display:flex;justify-content:center;gap:40px;margin-top:44px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.intro-meta strong{color:var(--ink);font-family:var(--serif);font-size:22px;font-weight:500;display:block;letter-spacing:-.01em}
.intro-trust{margin-top:56px;padding-top:30px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:32px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.intro-trust span{display:inline-flex;gap:6px;align-items:center}
.intro-trust svg{width:14px;height:14px}
.intro-glyph{width:60px;height:60px;margin:0 auto;color:var(--accent);opacity:.9}
.intro-glyph svg{width:100%;height:100%}

/* Section shell */
.section{padding:64px 0}
.section-head{text-align:center;max-width:620px;margin:0 auto 44px}
.section-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:14px}
.section-title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.5vw,44px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.section-title em{font-style:italic;color:var(--accent-deep)}
.section-sub{color:var(--ink-3);font-size:16px}

/* Hub test grid */
.test-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.test-card{display:flex;flex-direction:column;gap:14px;background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:28px;transition:all .18s;height:100%}
.test-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 16px 40px -16px rgba(26,40,66,.22)}
.test-card-glyph{width:44px;height:44px;border-radius:12px;background:var(--bg-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center}
.test-card-glyph svg{width:24px;height:24px}
.test-card h3{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0}
.test-card p{color:var(--ink-3);font-size:14px;margin:0;flex:1}
.test-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.test-card-tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
.test-card-go{font-size:13px;font-weight:600;color:var(--accent-deep);display:inline-flex;gap:6px;align-items:center}
.test-card-go svg{width:14px;height:14px;transition:transform .15s}
.test-card:hover .test-card-go svg{transform:translateX(3px)}
@media(max-width:700px){.test-grid{grid-template-columns:1fr}}

/* Steps / how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--bg-card);border:1px solid var(--line);border-radius:18px;padding:28px}
.step-index{font-family:var(--mono);font-size:12px;color:var(--accent-deep);letter-spacing:.08em;margin-bottom:12px}
.step h4{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 8px;letter-spacing:-.01em}
.step p{color:var(--ink-3);font-size:14px;margin:0}
@media(max-width:700px){.steps{grid-template-columns:1fr}}

/* Quiz */
.quiz{padding:56px 0;min-height:66vh;display:flex;flex-direction:column;justify-content:center}
.step-num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.question{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0 0 14px;max-width:720px}
.question em{font-style:italic;color:var(--accent-deep)}
.question-sub{color:var(--ink-3);font-size:16px;max-width:560px;margin-bottom:36px}
.options{display:flex;flex-direction:column;gap:10px;max-width:640px}
.option{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--bg-card);border:1px solid var(--line);border-radius:14px;font-size:16px;text-align:left;transition:all .15s;width:100%}
.option:hover{border-color:var(--ink);transform:translateX(4px)}
.option.selected{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.option-letter{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;transition:all .15s}
.option.selected .option-letter{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.option-label{flex:1}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:30px;border-top:1px solid var(--line);max-width:640px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:640px;margin-top:12px}
.scale-pt{aspect-ratio:1;border:1px solid var(--line-2);border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:var(--ink-3);transition:all .15s}
.scale-pt:hover{border-color:var(--ink);color:var(--ink)}
.scale-pt.selected{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.08)}
.scale-labels{display:flex;justify-content:space-between;max-width:640px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin-top:12px}

/* Cards (ESP / telepathy) */
.cards-stage{padding:48px 0 72px;min-height:66vh}
.cards-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cards-round{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.cards-score{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent-deep)}
.cards-face{margin:24px auto 32px;width:150px;height:200px;border-radius:18px;border:1px solid var(--line-2);background:var(--bg-card);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 12px 30px -18px rgba(26,40,66,.4)}
.cards-face .zener{width:84px;height:84px;color:var(--accent-deep)}
.cards-face .zener svg{width:100%;height:100%}
.cards-face .back{position:absolute;inset:0;border-radius:18px;background:repeating-linear-gradient(45deg,#1a2842,#1a2842 8px,#24345a 8px,#24345a 16px);display:flex;align-items:center;justify-content:center;color:#b8c8e0;font-family:var(--serif);font-style:italic;font-size:15px}
.cards-face.reveal.correct{border-color:var(--green);box-shadow:0 0 0 2px rgba(74,122,82,.4)}
.cards-face.reveal.wrong{border-color:var(--line-2)}
.cards-verdict{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;height:16px;margin-bottom:18px}
.cards-verdict.hit{color:var(--green)}.cards-verdict.miss{color:var(--ink-4)}
.cards-choices{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:560px;margin:0 auto}
.cards-choices.n4{grid-template-columns:repeat(4,1fr);max-width:460px}
.choice-sym{aspect-ratio:1;border:1px solid var(--line-2);border-radius:14px;background:var(--bg-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);transition:all .15s;padding:8px}
.choice-sym:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}
.choice-sym[disabled]{opacity:.4;pointer-events:none}
.choice-sym .zener{width:40px;height:40px}.choice-sym .zener svg{width:100%;height:100%}
.choice-sym span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
.cards-hint{text-align:center;color:var(--ink-3);font-size:15px;margin:28px auto 0;max-width:440px}
@media(max-width:600px){.cards-choices{gap:8px}.choice-sym .zener{width:32px;height:32px}}

/* Result */
.result{padding:56px 0 84px}
.result-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:16px}
.result-title{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,54px);line-height:1.06;letter-spacing:-.02em;margin:0 0 16px}
.result-title em{font-style:italic;color:var(--accent-deep)}
.result-sub{font-size:18px;color:var(--ink-3);max-width:560px;margin-bottom:44px}
.archetype-card{background:var(--bg-card);border:1px solid var(--line);border-radius:24px;padding:44px;margin-bottom:32px}
.archetype-header{display:flex;gap:24px;align-items:flex-start;margin-bottom:26px}
.archetype-glyph{width:72px;height:72px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 30% 30%,#fff,#b8c8e0 40%,#4a6fa5 80%,#1a2842);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.archetype-name{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
.archetype-kicker{color:var(--ink-3);font-size:14px}
.archetype-body{color:var(--ink-2);font-size:16px;line-height:1.62}
.archetype-body p{margin:0 0 14px}
.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;padding-top:30px;border-top:1px solid var(--line)}
.trait-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.trait-val{font-family:var(--serif);font-size:18px;font-weight:500}
@media(max-width:600px){.traits{grid-template-columns:1fr}.archetype-card{padding:26px}.archetype-header{flex-direction:column;gap:16px}}

.recommend{margin-top:44px}
.recommend h3{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;margin:0 0 10px}
.recommend p{color:var(--ink-3);margin-bottom:24px}
.rec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rec-card{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;gap:16px;align-items:center;transition:all .15s}
.rec-card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:0 8px 24px -8px rgba(26,40,66,.14)}
.rec-photo{width:60px;height:60px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto;background-color:var(--bg-soft)}
.rec-body{flex:1;min-width:0}
.rec-name{font-family:var(--serif);font-size:18px;font-weight:500}
.rec-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.rec-match{font-family:var(--mono);font-size:11px;color:var(--accent-deep);background:var(--bg-soft);padding:4px 8px;border-radius:999px;letter-spacing:.05em}
@media(max-width:600px){.rec-grid{grid-template-columns:1fr}}

.result-cta{margin-top:44px;padding:32px;background:var(--ink);color:var(--bg);border-radius:24px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.result-cta-text{max-width:440px}
.result-cta-text h4{font-family:var(--serif);font-size:24px;font-weight:500;margin:0 0 6px;letter-spacing:-.015em}
.result-cta-text p{margin:0;opacity:.78;font-size:14px}
.result-cta .btn{background:var(--bg);color:var(--ink)}
.result-more{text-align:center;margin-top:36px;font-size:14px;color:var(--ink-3)}
.result-more a{color:var(--accent-deep);font-weight:600}

.footer{padding:44px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:24px}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.footer-links a:hover{color:var(--ink)}
.disclaimer-note{max-width:960px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--ink-4);text-align:center;line-height:1.6}

.fade-in{animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>

<style id="wp-custom-css">
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{--bg:#f0f4f8;--bg-soft:#e4ecf4;--bg-card:#f8fafc;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#6b6b6b;--ink-4:#9aa3af;--line:#d6dfe8;--line-2:#bcc9d8;--accent:#4a6fa5;--accent-deep:#1a2842;--green:#4a7a52;--serif:"Fraunces",Georgia,serif;--sans:"Inter",-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.container{max-width:920px;margin:0 auto;padding:0 24px}
.header{padding:24px 0;border-bottom:1px solid var(--line);background:rgba(240,244,248,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.header-inner{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center;font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 180deg,#1a2842,#4a6fa5,#b8c8e0,#1a2842);position:relative}
.logo-mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.logo-mark::before{content:"";position:absolute;top:3px;left:50%;width:2px;height:20px;background:var(--ink);transform:translateX(-50%);border-radius:2px}
.header-meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.progress-wrap{padding:16px 0;border-bottom:1px solid var(--line)}
.progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}

.intro{padding:80px 0 96px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:6px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:999px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,68px);line-height:1.02;letter-spacing:-.025em;margin:20px 0 20px}
h1 em{font-style:italic;font-weight:300;color:var(--accent-deep)}
.lede{font-size:18px;color:var(--ink-2);max-width:560px;margin:0 auto 36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 28px;font-size:15px;font-weight:600;border-radius:999px;transition:all .15s}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(26,40,66,.35)}
.btn-secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-secondary:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.btn-ghost{color:var(--ink-3);padding:0 16px;height:44px}
.intro-meta{display:flex;justify-content:center;gap:40px;margin-top:48px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.intro-meta strong{color:var(--ink);font-family:var(--serif);font-size:22px;font-weight:500;display:block;letter-spacing:-.01em}
.intro-trust{margin-top:64px;padding-top:32px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:32px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.intro-trust span{display:inline-flex;gap:6px;align-items:center}
.intro-trust svg{width:14px;height:14px}

/* Quiz */
.quiz{padding:64px 0;min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.step-num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.question{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,44px);line-height:1.1;letter-spacing:-.02em;margin:0 0 16px;max-width:720px}
.question em{font-style:italic;color:var(--accent-deep)}
.question-sub{color:var(--ink-3);font-size:16px;max-width:560px;margin-bottom:40px}
.options{display:flex;flex-direction:column;gap:10px;max-width:640px}
.option{display:flex;align-items:center;gap:16px;padding:20px 24px;background:var(--bg-card);border:1px solid var(--line);border-radius:14px;font-size:16px;text-align:left;transition:all .15s;width:100%}
.option:hover{border-color:var(--ink);transform:translateX(4px)}
.option.selected{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.option-letter{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;transition:all .15s}
.option.selected .option-letter{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.option-label{flex:1}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:48px;padding-top:32px;border-top:1px solid var(--line);max-width:640px}

/* Scale */
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:640px;margin-top:12px}
.scale-pt{aspect-ratio:1;border:1px solid var(--line-2);border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:var(--ink-3);transition:all .15s}
.scale-pt:hover{border-color:var(--ink);color:var(--ink)}
.scale-pt.selected{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.08)}
.scale-labels{display:flex;justify-content:space-between;max-width:640px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin-top:12px}

/* Result */
.result{padding:64px 0 96px;display:none}
.result.show{display:block}
.result-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:16px}
.result-title{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.5vw,60px);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px}
.result-title em{font-style:italic;color:var(--accent-deep)}
.result-sub{font-size:18px;color:var(--ink-3);max-width:560px;margin-bottom:48px}
.archetype-card{background:var(--bg-card);border:1px solid var(--line);border-radius:24px;padding:48px;margin-bottom:32px}
.archetype-header{display:flex;gap:24px;align-items:flex-start;margin-bottom:28px}
.archetype-glyph{width:72px;height:72px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 30% 30%,#fff,#b8c8e0 40%,#4a6fa5 80%,#1a2842);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);position:relative}
.archetype-name{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
.archetype-kicker{color:var(--ink-3);font-size:14px}
.archetype-body{color:var(--ink-2);font-size:16px;line-height:1.6}
.archetype-body p{margin:0 0 14px}
.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;padding-top:32px;border-top:1px solid var(--line)}
.trait-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.trait-val{font-family:var(--serif);font-size:18px;font-weight:500}

.recommend{margin-top:48px}
.recommend h3{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.015em;margin:0 0 20px}
.recommend p{color:var(--ink-3);margin-bottom:24px}
.rec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rec-card{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;gap:16px;align-items:center;cursor:pointer;transition:all .15s}
.rec-card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:0 8px 24px -8px rgba(26,40,66,.12)}
.rec-photo{width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto}
.rec-body{flex:1;min-width:0}
.rec-name{font-family:var(--serif);font-size:18px;font-weight:500;display:flex;gap:4px;align-items:center}
.rec-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.rec-match{font-family:var(--mono);font-size:11px;color:var(--accent-deep);background:var(--bg-soft);padding:4px 8px;border-radius:999px;letter-spacing:.05em}

.result-cta{margin-top:48px;padding:32px;background:var(--ink);color:var(--bg);border-radius:24px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.result-cta-text{max-width:420px}
.result-cta-text h4{font-family:var(--serif);font-size:24px;font-weight:500;margin:0 0 6px;letter-spacing:-.015em}
.result-cta-text p{margin:0;opacity:.75;font-size:14px}
.result-cta .btn{background:var(--bg);color:var(--ink)}

.footer{padding:48px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:48px}

/* Animations */
.fade-in{animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:700px){
  .rec-grid,.traits{grid-template-columns:1fr}
  .scale{grid-template-columns:repeat(7,1fr);gap:4px}
  .archetype-card{padding:28px}
  .archetype-header{flex-direction:column;gap:16px}
}

<script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">const { useState } = React;
const T = window.PTC_TEST;
const SPECIALISTS = window.PTC_SPECIALISTS || [];
const CONSULT = window.PTC_CONSULT || "/talk-to-a-psychic/";
const ZENER = {
  circle: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="3"><circle cx="30" cy="30" r="20"/></svg>',
  cross:  '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="3"><path d="M30 10v40M10 30h40"/></svg>',
  waves:  '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="3"><path d="M8 20c6-8 12 8 18 0s12 8 18 0M8 32c6-8 12 8 18 0s12 8 18 0M8 44c6-8 12 8 18 0s12 8 18 0"/></svg>',
  square: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="3"><rect x="12" y="12" width="36" height="36"/></svg>',
  star:   '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M30 8l6.5 15.5L53 25l-12.5 11L44 52 30 43 16 52l3.5-16L7 25l16.5-1.5z"/></svg>',
};

function matchSpecialists(cats, limit){
  limit = limit || 2;
  const scored = SPECIALISTS.map(s => ({...s, _s: (s.cats||[]).filter(c => (cats||[]).indexOf(c) > -1).length}));
  scored.sort((a,b) => b._s - a._s);
  return scored.slice(0, limit);
}
function letterFor(i){ return ["A","B","C","D","E","F"][i]; }

function Intro({ onStart }){
  return (
    <section className="intro fade-in">
      <span className="eyebrow"><span className="dot"/>{T.eyebrow}</span>
      <h1 dangerouslySetInnerHTML={{__html: T.title.replace(/\*(.+?)\*/g,'<em>$1</em>')}}/>
      <p className="lede">{T.lede}</p>
      <button className="btn btn-primary" onClick={onStart}>Begin the test
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div className="intro-trust">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Anonymous</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M12 3l8 3v5c0 5-3.4 9.3-8 10-4.6-.7-8-5-8-10V6z"/></svg>No sign-up</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Instant result</span>
      </div>
    </section>
  );
}

function Question({ q, idx, total, value, onAnswer, onNext, onBack }){
  return (
    <section className="quiz fade-in" key={q.id}>
      <div className="step-num">Question {idx+1} of {total}</div>
      <h2 className="question" dangerouslySetInnerHTML={{__html: q.prompt.replace(/\*(.+?)\*/g,'<em>$1</em>')}}/>
      {q.sub ? <p className="question-sub">{q.sub}</p> : null}
      {q.type === "choice" && (
        <div className="options">
          {q.options.map((o,i) => (
            <button key={i} className={"option"+(value===i?" selected":"")} onClick={() => onAnswer(i)}>
              <span className="option-letter">{letterFor(i)}</span>
              <span className="option-label">{o.label}</span>
            </button>
          ))}
        </div>
      )}
      {q.type === "scale" && (
        <>
          <div className="scale">
            {[1,2,3,4,5,6,7].map(n => (
              <button key={n} className={"scale-pt"+(value===n?" selected":"")} onClick={() => onAnswer(n)}>{n}</button>
            ))}
          </div>
          <div className="scale-labels"><span>Not at all</span><span>Completely</span></div>
        </>
      )}
      <div className="nav-row">
        <button className="btn btn-ghost" onClick={onBack} style={{visibility: idx===0?"hidden":"visible"}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Previous
        </button>
        <button className="btn btn-primary" onClick={onNext} disabled={value===undefined}
          style={{opacity: value===undefined?0.4:1, pointerEvents: value===undefined?"none":"auto"}}>
          {idx===total-1 ? "See my result" : "Continue"}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  );
}

function Cards({ onDone }){
  const cfg = T.cards;
  const rounds = cfg.rounds;
  const [round, setRound] = useState(0);
  const [correct, setCorrect] = useState(0);
  const [target, setTarget] = useState(() => Math.floor(Math.random()*cfg.symbols.length));
  const [picked, setPicked] = useState(null); // index into symbols
  const revealed = picked !== null;
  const isHit = revealed && cfg.symbols[picked].k === cfg.symbols[target].k;

  function pick(i){
    if (revealed) return;
    setPicked(i);
    const hit = cfg.symbols[i].k === cfg.symbols[target].k;
    if (hit) setCorrect(c => c+1);
    setTimeout(() => {
      const next = round+1;
      if (next >= rounds){ onDone(hit?correct+1:correct, rounds); return; }
      setRound(next); setPicked(null); setTarget(Math.floor(Math.random()*cfg.symbols.length));
    }, 950);
  }

  const targetKey = cfg.symbols[target].k;
  return (
    <section className="cards-stage fade-in">
      <div className="container" style={{maxWidth:640}}>
        <div className="cards-top">
          <span className="cards-round">Round {round+1} of {rounds}</span>
          <span className="cards-score">{correct} sensed</span>
        </div>
        <div className={"cards-face"+(revealed?(" reveal "+(isHit?"correct":"wrong")):"")}>
          {revealed
            ? <span className="zener" dangerouslySetInnerHTML={{__html: ZENER[targetKey]}}/>
            : <span className="back">focus…</span>}
        </div>
        <div className={"cards-verdict "+(revealed?(isHit?"hit":"miss"):"")}>{revealed?(isHit?"A hit":"Not this time"):""}</div>
        <p className="question-sub" style={{textAlign:"center",margin:"0 auto 22px"}}>{cfg.prompt}<br/><span style={{color:"var(--ink-4)"}}>{cfg.sub}</span></p>
        <div className={"cards-choices"+(cfg.symbols.length===4?" n4":"")}>
          {cfg.symbols.map((s,i) => (
            <button key={i} className="choice-sym" disabled={revealed} onClick={() => pick(i)}>
              <span className="zener" dangerouslySetInnerHTML={{__html: ZENER[s.k]}}/>
              <span>{s.label}</span>
            </button>
          ))}
        </div>
      </div>
    </section>
  );
}

function computeArchetype(answers){
  const tally = {};
  T.questions.forEach(q => {
    const v = answers[q.id];
    if (v === undefined) return;
    if (q.type === "choice"){
      const tags = (q.options[v] && q.options[v].tags) || {};
      Object.keys(tags).forEach(k => { tally[k] = (tally[k]||0) + tags[k]; });
    }
  });
  let best = null, bestN = -1;
  Object.keys(T.results).forEach(k => { const n = tally[k]||0; if (n > bestN){ bestN = n; best = k; } });
  if (best === null) best = Object.keys(T.results)[0];
  return T.results[best];
}
function computeLevelPct(answers){
  let score = 0, max = 0;
  T.questions.forEach(q => {
    if (q.type === "choice"){
      max += 3;
      const v = answers[q.id];
      if (v !== undefined) score += (q.options[v] && q.options[v].pts) || 0;
    } else if (q.type === "scale"){
      max += 3;
      const v = answers[q.id];
      if (v !== undefined) score += Math.round(((v-1)/6)*3);
    }
  });
  return max ? Math.round((score/max)*100) : 0;
}
function levelForPct(pct){
  // levels are ordered high-min first
  for (let i=0;i<T.levels.length;i++){ if (pct >= T.levels[i].min) return T.levels[i]; }
  return T.levels[T.levels.length-1];
}

function Result({ result, note, onRestart }){
  const recs = matchSpecialists(result.cats, 2);
  return (
    <section className="result fade-in">
      <div className="result-eyebrow">Your result</div>
      <h2 className="result-title" dangerouslySetInnerHTML={{__html: "You are <em>"+result.name+".</em>"}}/>
      <p className="result-sub">{result.kicker}.</p>
      {note ? <p className="question-sub" style={{marginTop:-24}}>{note}</p> : null}

      <div className="archetype-card">
        <div className="archetype-header">
          <div className="archetype-glyph"/>
          <div>
            <h3 className="archetype-name">{result.name}</h3>
            <div className="archetype-kicker">{result.kicker}</div>
          </div>
        </div>
        <div className="archetype-body">{result.body.map((p,i) => <p key={i}>{p}</p>)}</div>
        <div className="traits">
          {Object.keys(result.traits).map(k => (
            <div key={k}><div className="trait-label">{k}</div><div className="trait-val">{result.traits[k]}</div></div>
          ))}
        </div>
      </div>

      <div className="recommend">
        <h3>Readers we'd suggest for you</h3>
        <p>Chosen from your result. Each has a strong record with exactly this.</p>
        <div className="rec-grid">
          {recs.map(p => (
            <a key={p.id} className="rec-card" href={CONSULT}>
              <div className="rec-photo" style={{backgroundImage:"url("+p.photo+")"}}/>
              <div className="rec-body"><div className="rec-name">{p.name}</div><div className="rec-meta">{p.meta}</div></div>
              <div className="rec-match">Great fit</div>
            </a>
          ))}
        </div>
      </div>

      <div className="result-cta">
        <div className="result-cta-text">
          <h4>Talk it through with a specialist.</h4>
          <p>Your first few minutes are free. Start a reading with a matched reader — end anytime, no charge if it isn't right.</p>
        </div>
        <a className="btn btn-primary" href={CONSULT}>Talk to a specialist
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <div className="result-more">
        <button className="btn btn-ghost" onClick={onRestart}>Retake the test</button>
        <div style={{marginTop:10}}>Or <a href="/">try another test</a>.</div>
      </div>
    </section>
  );
}

function App(){
  const [stage, setStage] = useState("intro"); // intro | quiz | cards | result
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [finished, setFinished] = useState(null); // {result, note}

  const start = () => setStage(T.engine === "cards" ? "cards" : "quiz");

  function onAnswer(v){ setAnswers(a => ({...a, [T.questions[idx].id]: v})); }
  function onNext(){
    if (idx === T.questions.length-1){ finishQuiz(); }
    else setIdx(idx+1);
  }
  function onBack(){ setIdx(Math.max(0, idx-1)); }

  function finishQuiz(){
    if (T.mode === "archetype"){ setFinished({result: computeArchetype(answers)}); }
    else {
      const pct = computeLevelPct(answers);
      setFinished({result: levelForPct(pct)});
    }
    setStage("result");
  }
  function onCardsDone(correct, rounds){
    const pct = Math.round((correct/rounds)*100);
    setFinished({result: levelForPct(pct), note: "You sensed "+correct+" of "+rounds+" ("+pct+"%). Pure chance is about "+(T.cards.chance)+"%."});
    setStage("result");
  }

  const q = T.questions ? T.questions[idx] : null;
  const val = q ? answers[q.id] : undefined;
  const total = T.questions ? T.questions.length : 0;
  const pct = stage==="result" ? 100 : (stage==="quiz" ? ((idx+1)/total)*100 : (stage==="cards"?50:0));

  return (
    <>
      <header className="header">
        <div className="container header-inner">
          <a className="logo" href="/"><span className="logo-mark"/>Psychic Test</a>
          <nav className="header-nav">
            <a href="/">All tests</a>
            <a href={CONSULT} className="btn btn-secondary">Talk to a psychic</a>
          </nav>
        </div>
      </header>

      {stage !== "intro" && (
        <div className="progress-wrap"><div className="container">
          <div className="progress-label">
            <span>{stage==="result" ? "Complete" : (stage==="cards" ? "In progress" : "Question "+(idx+1)+" / "+total)}</span>
            <span>{Math.round(pct)}%</span>
          </div>
          <div className="progress-bar"><div className="progress-fill" style={{width: pct+"%"}}/></div>
        </div></div>
      )}

      <main className="container">
        {stage==="intro" && <Intro onStart={start}/>}

      </main>

      </footer>
    </>
  );
}
